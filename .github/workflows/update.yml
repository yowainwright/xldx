name: update deps

on:
  schedule:
    - cron: "0 5 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  udpate-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile
      - run: bun run update
      - run: bun run format
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run deps:security
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}
          commit-message: Update dependencies
          title: "[Codependence]  update dependencies"
          body: |
            ## Dependency updates
            Auto-generated by [codependence][1] using [create-pull-request][2]
            [1]: https://github.com/yowainwright/xldx
            [2]: https://github.com/peter-evans/create-pull-request
          branch: update-dependencies
          labels: codependencies
